# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open the n8n-nodes-technocore package settings.
#   2. Under "Trusted Publisher", choose GitHub Actions and fill in:
#        Organization or user: OoJae
#        Repository:           n8n-nodes-technocore
#        Workflow filename:    publish.yml
#        Environment:          (leave blank; this workflow uses none)
#   3. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches the repo settings.
#   Trusted publishing needs npm CLI 11.5.1 or later; the "Ensure npm >= 11.5.1"
#   step below guarantees it (Node 24 plus an in-place npm upgrade if needed).
#   The package must already exist on npm before a trusted publisher can be
#   added, so the very first version is published by hand (see README, Releasing).
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" with no "v" prefix (e.g. 0.2.0),
# the format `npm run release` (release-it) creates for this package. The
# "Check the tag matches package.json" step refuses any tag that is not exactly
# the package.json version, so a stray tag such as v0.2.0 or 0.2.0-typo cannot
# publish. The convention is documented in README.md (Releasing).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc. (no "v" prefix; see TAG CONVENTION above).
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        run: |
          at_least() { node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1); }' "$1" "$2"; }
          if ! at_least "$(npm --version)" 11.5.1; then
            npm install -g npm@^11.5.1
          fi
          at_least "$(npm --version)" 11.5.1 || { echo "npm $(npm --version) is older than 11.5.1"; exit 1; }
          echo "node $(node --version), npm $(npm --version)"

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        # No dependency lifecycle scripts in a job that can mint an OIDC token.
        run: npm ci --ignore-scripts

      - name: Verify (secret scan, vendored protocol, type-check, unit tests)
        run: |
          npm run secret-scan
          npm run vendor:check
          npm run typecheck
          npm run test:unit

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `n8n-node release` already sets this when publishing; kept explicit so the
          # provenance attestation cannot be dropped by a CLI change.
          NPM_CONFIG_PROVENANCE: 'true'
